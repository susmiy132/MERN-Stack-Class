<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0" />
    <title>National Census Form</title>
</head>

<body>
    <div>
        <h1>National Census Form</h1>
        <form>
            <h2>Personal Information</h2>
            <div>
                <label>Census date</label>
                <input class="input-field" type="date" id="census-date" readonly disabled>
                <p class="info-text"></p>
            </div>
            <div>
                <label>Census ID</label>
                <input class="input-field" type="text" value="CEN-2025-00123456" readonly>
                <p class="info-text"></p>
            </div>
            <div>
                <label>Full Legal Name *</label>
                <input class="input-field" type="text" placeholder="Enter yo ur full name as per government ID"
                    required>
            </div>
            <div>
                <label>Date of Birth *</label>
                <input class="input-field" type="text" required>
            </div>

            <div>
                <label>Gender *</label>
                <div>
                    <input type="radio" name="gender" id="male">
                    <label class for="male">Male</label>
                    <input type="radio" name="gender" id="female">
                    <label class for="female">Female</label>
                    <input type="radio" name="gender" id="other">
                    <label class for="other">Other</label>
                    <input type="radio" name="gender" id="prefer-not">
                    <label class for="prefer-not">Prefer not to say</label>
                </div>
            </div>
            <br>
            <h2>Household Information</h2>

            <div>
                <label>Total Household Members *</label>
                <input type="number" class="input-field" placeholder="Enter number of people living in your household"
                    min="1" required>
            </div>

            <div>
                <label>Housing Type</label>
                <div>

                    <input type="radio" name="housing" id="house">
                    <label class="radio-label" for="house">House</label>
                    <input type="radio" name="housing" id="apartment">
                    <label class="radio-label" for="apartment">Apartment</label>
                    <input type="radio" name="housing" id="other-housing">
                    <label class="radio-label" for="other-housing">Other</label>
                </div>
            </div>
            <br>
            <div>
                <label>Ownership Status</label>
                <div>
                    <input type="checkbox" id="own">
                    <label class="checkbox-label" for="own">Own</label>
                    <input type="checkbox" id="rent">
                    <label class="checkbox-label" for="rent">Rent</label>
                    <input type="checkbox" id="mortgage">
                    <label class="checkbox-label" for="mortgage">Mortgage</label>
                </div>
            </div>

            <br>
            <h2>Document Verification</h2>
            <div>
                <label>Upload Government ID (Passport, Driver's Liscense, etc.)</label>
                <input class="input-field" type="file" accept=".pdf, .jpg, .jpeg, .png">
                <p class="info-text">
                    "Drag and drop your ID document or click to browse(Max5MB)"
                </p>
            </div>

            <div>
                <label>Upload Proof of Resience (Utlity Bill, Lease Agreement, etc.)</label>
                <input class="input-field" type="file" accept=".pdf, .jpg, .jpeg, .png">
                <p class="info-text">
                    "Drag and drop your ID document or click to browse(Max5MB)"
                </p>
            </div>
        </form>
    </div>
</body>

</html>
