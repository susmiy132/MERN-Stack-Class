<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0" />
    <title>National Census Form</title>
</head>

<body>
    <div>
        <h1>National Census Form</h1>
        <form>
            <h2>Personal Information</h2>
            <div>
                <label>Census date</label>
                <input class="input-field" type="date" id="census-date" readonly disabled>
                <p class="info-text"></p>
            </div>
            <div>
                <label>Census ID</label>
                <input class="input-field" type="text" value="CEN-2025-00123456" readonly>
                <p class="info-text"></p>
            </div>
            <div>
                <label>Full Legal Name *</label>
                <input class="input-field" type="text" placeholder="Enter yo ur full name as per government ID"
                    required>
            </div>
            <div>
                <label>Date of Birth *</label>
                <input class="input-field" type="text" required>
            </div>

            <div>
                <label>Gender *</label>
                <div>
                    <input type="radio" name="gender" id="male">
                    <label class for="male">Male</label>
                    <input type="radio" name="gender" id="female">
                    <label class for="female">Female</label>
                    <input type="radio" name="gender" id="other">
                    <label class for="other">Other</label>
                    <input type="radio" name="gender" id="prefer-not">
                    <label class for="prefer-not">Prefer not to say</label>
                </div>
            </div>
            <br>
            <h2>Household Information</h2>

            <div>
                <label>Total Household Members *</label>
                <input type="number" class="input-field" placeholder="Enter number of people living in your household"
                    min="1" required>
            </div>

            <div>

            </div>
        </form>
    </div>
</body>

</html>
